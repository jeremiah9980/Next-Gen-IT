[lint]
# Pin to the classic pycodestyle + pyflakes selection so a ruff version bump
# doesn't retroactively fail existing code across the repo. Rules that were
# added or turned on by default in newer ruff releases (BLE001, FURB188,
# UP035, I001, EXE001, PLW1510, RUF100, B008, N999, D103, …) can be opted
# into intentionally later.
select = ["E4", "E7", "E9", "F"]

# E701/E702 – compact inline statements in the audit script are intentional
ignore = ["E701", "E702"]
